services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-Etc/UTC}
    image: agentic-sandbox:latest
    container_name: agentic-sandbox
    stdin_open: true
    tty: true

    # Bridge networking (default for compose). The container reaches the
    # internet via NAT; egress is filtered by init-firewall.sh which runs
    # from the entrypoint. To join a user-defined network like `dev-net`
    # (so the sandbox can talk to other dev containers by name), uncomment
    # the `networks` block below and ensure the network exists:
    #     docker network create dev-net
    #
    # networks:
    #   - default
    #   - dev-net

    # NET_ADMIN/NET_RAW: the in-container iptables firewall.
    # SYS_PTRACE: lets the root privileged-boot wrapper read /proc/1/environ,
    # which is where it takes its config from (a source the container cannot
    # forge). Without it the wrapper fails and, since the firewall now fails
    # closed, the container refuses to start.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE

    # Publish the sandbox's host-visible port. Override at compose-up time
    # via SANDBOX_HOST_PORT, e.g.:
    #     SANDBOX_HOST_PORT=49234 docker compose up
    # The CLI (agent-sandbox.sh) picks a random port from 49200-49300
    # automatically; for compose you choose explicitly.
    ports:
      - "${SANDBOX_HOST_PORT:-49234}:${SANDBOX_HOST_PORT:-49234}"

    volumes:
      # Named volumes for isolated, persistent agent config
      - claude-config:/home/agent/.claude
      - copilot-config:/home/agent/.copilot
      - vibe-config:/home/agent/.vibe
      - gh-config:/home/agent/.config/gh

      # Project directory — set PROJECT_DIR env var or defaults to current dir
      - ${PROJECT_DIR:-./_project}:/workspace

    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GITHUB_TOKEN=${SANDBOX_GITHUB_TOKEN:-${GITHUB_TOKEN:-}}
      - SANDBOX_HOST_PORT=${SANDBOX_HOST_PORT:-49234}
      - SSH_AUTH_SOCK=

    # Docker's default /dev/shm is 64 MB; Chromium keeps its shared-memory
    # buffers there and its renderer crashes ("Page crashed") when it fills.
    shm_size: 1gb

    # Resource limits to prevent runaway agents
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"

# Uncomment to attach to an external user-defined network.
# networks:
#   dev-net:
#     external: true

volumes:
  claude-config:
  copilot-config:
  vibe-config:
  gh-config:
